services:

  odds-api-producer:
    build:
      context: ./producers
      dockerfile: odds_api_producer/Dockerfile
    restart: unless-stopped
    environment:
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./producers/sports_config.json:/app/sports_config.json
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  game-events-producer:
    build:
      context: ./producers
      dockerfile: game_events_producer/Dockerfile
    restart: unless-stopped
    environment:
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./producers/sports_config.json:/app/sports_config.json
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kalshi-producer:
    build:
      context: ./producers
      dockerfile: kalshi_producer/Dockerfile
    restart: unless-stopped
    environment:
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./producers/sports_config.json:/app/sports_config.json
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
